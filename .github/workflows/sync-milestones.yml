name: Sync milestones

on:
  push:
    branches: [main]
    paths:
      - ROADMAP.md
      - scripts/sync-github-milestones.py
      - scripts/tests/**
      - .github/workflows/sync-milestones.yml
      # The stdlib tests also check the site, the assessment, the labs'
      # documents, and the documents they mirror, so changes there must run
      # them too.
      - site/**
      - assessments/**
      - docs/**
      - capstones/**/DECISIONS.md
      - labs/**
      - pom.xml
      - README.md
  pull_request:
    paths:
      - ROADMAP.md
      - scripts/sync-github-milestones.py
      - scripts/tests/**
      - .github/workflows/sync-milestones.yml
      # The stdlib tests also check the site, the assessment, the labs'
      # documents, and the documents they mirror, so changes there must run
      # them too.
      - site/**
      - assessments/**
      - docs/**
      - capstones/**/DECISIONS.md
      - labs/**
      - pom.xml
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run Python tests
        run: python -m unittest discover -s scripts/tests -v

  sync:
    name: Synchronize milestones
    # Mutation runs only after changes reach main. Pull requests, including
    # fork pull requests without write tokens, stop at the validate job.
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Sync milestones from ROADMAP.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync-github-milestones.py
