name: Documentation improvement
description: Report a gap, error, or unclear explanation in the docs
body:
  - type: input
    id: page
    attributes:
      label: Which page?
      description: Path or link, for example docs/glossary.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
    validations:
      required: false
